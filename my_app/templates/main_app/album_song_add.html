{% extends 'layouts/base.html' %}
{% load static %}

{% block breadcrumbs %}{% endblock breadcrumbs %}

{% block content %}
<div class="container-xxl flex-grow-1 container-p-y">

    <!-- Display Django Messages -->
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %} alert-dismissible fade show text-center" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    <!-- Basic Layout & Basic with Icons -->
    <div class="row">
        <!-- Basic Layout -->
        <div class="col-xxl">
            <div class="card mb-6">
                <div class="card-header d-flex align-items-center justify-content-between">
                    <h5 class="mb-0">Add Song</h5>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'album_song_add' album_id %}" id="submit-button" enctype="multipart/form-data">
                        {% csrf_token %}
                        <input type="hidden" class="form-control" id="name" name="album_id" value="{{album_id}}">
                        <!-- Song Name -->
                        <div class="row mb-6">
                            <label class="col-sm-2 col-form-label" for="name">Song Name</label>
                            <div class="col-sm-10">
                                <div class="input-group input-group-merge">
                                    <span id="name-icon" class="input-group-text">
                                        <i class="bx bx-music"></i>
                                    </span>
                                    <input type="text" class="form-control" id="name" name="name" placeholder="Enter Song Name" required>
                                </div>
                            </div>
                        </div>
                    
                        <!-- Song Image -->
                        <div class="row mb-6">
                            <label class="col-sm-2 col-form-label" for="image">Song Image</label>
                            <div class="col-sm-10">
                                <div class="input-group input-group-merge">
                                    <span id="image-icon" class="input-group-text">
                                        <i class="bx bxs-image"></i>
                                    </span>
                                    <input type="file" class="form-control" id="image" name="image">
                                </div>
                            </div>
                        </div>

                        <!-- Radio Buttons for Song Source -->
                        <div class="row mb-6">
                            <label class="col-sm-2 col-form-label">Song Source</label>
                            <div class="col-sm-10">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="song_source" id="song_url_radio" value="url" onclick="toggleSongSource()" checked>
                                    <label class="form-check-label" for="song_url_radio">Song URL</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="song_source" id="song_file_radio" value="file" onclick="toggleSongSource()">
                                    <label class="form-check-label" for="song_file_radio">Upload Song File</label>
                                </div>
                            </div>
                        </div>

                        <!-- Song URL -->
                        <div class="row mb-6" id="song_url_field">
                            <label class="col-sm-2 col-form-label" for="song_url">Song URL</label>
                            <div class="col-sm-10">
                                <div class="input-group input-group-merge">
                                    <span id="url-icon" class="input-group-text">
                                        <i class="bx bx-link"></i>
                                    </span>
                                    <input type="url" class="form-control" id="song_url" name="song_url" placeholder="Enter Song URL">
                                </div>
                            </div>
                        </div>

                        <!-- Upload Song File -->
                        <div class="row mb-6 d-none" id="song_file_field">
                            <label class="col-sm-2 col-form-label" for="song_file">Upload Song</label>
                            <div class="col-sm-10">
                                <div class="input-group input-group-merge">
                                    <span id="file-icon" class="input-group-text">
                                        <i class="bx bx-upload"></i>
                                    </span>
                                    <input type="file" class="form-control" id="song_file" name="song_file">
                                </div>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="row justify-content-end">
                            <div class="col-sm-10">
                                <button type="submit" class="btn btn-primary" id="submit-btn">
                                    <i class="mdi mdi-music-note mdi-24px me-1"></i>Add Song
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Toggle visibility of song source fields
    function toggleSongSource() {
        const urlField = document.getElementById('song_url_field');
        const fileField = document.getElementById('song_file_field');
        const urlRadio = document.getElementById('song_url_radio');
        
        if (urlRadio.checked) {
            urlField.classList.remove('d-none');
            fileField.classList.add('d-none');
        } else {
            urlField.classList.add('d-none');
            fileField.classList.remove('d-none');
        }
    }

    // Disable the submit button to prevent multiple submissions
    document.querySelector("form").addEventListener("submit", function() {
        document.getElementById("submit-btn").disabled = true;
    });

    // Initialize the song source fields based on the radio button selection when the page loads
    window.onload = function() {
        toggleSongSource();
    };
</script>
{% endblock content %}
